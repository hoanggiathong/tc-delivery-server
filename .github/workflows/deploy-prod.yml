name: Deploy to VPS Production Environment

on:
  push:
    branches: [prod]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to VPS Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd prod/tc-delivery-server/

            # Pull latest changes and fetch tags
            git fetch --tags
            git pull origin prod

            # Generate version tag
            YEAR=$(date +%Y)
            MONTH=$(date +%-m)
            TAG_PREFIX="${YEAR}.${MONTH}"

            # Get latest tag for this month
            LATEST_TAG=$(git tag -l "${TAG_PREFIX}.*" | sort -t. -k3 -n | tail -1)

            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="${TAG_PREFIX}.1"
            else
              LAST_NUM=$(echo "$LATEST_TAG" | cut -d. -f3)
              NEW_NUM=$((LAST_NUM + 1))
              NEW_VERSION="${TAG_PREFIX}.${NEW_NUM}"
            fi

            echo "Creating tag: ${NEW_VERSION}"

            # Create and push tag
            git tag -a "${NEW_VERSION}" -m "Production release ${NEW_VERSION}"
            git push origin "${NEW_VERSION}"

            # Load NVM and use default Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Current Node version:"
            node --version

            nvm use default

            # Install dependencies
            npm ci

            # Clean typescript build cache
            rm -rf dist/

            # Build and deploy Production environment
            npm run deploy:prod

            # Show PM2 status
            pm2 status tc-delivery-server-prod

            # Show logs (last 20 lines)
            pm2 logs tc-delivery-server-prod --lines 20 --nostream

            echo "Deployed version: ${NEW_VERSION}"
