name: Deploy to VPS Production Environment

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to VPS Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Generate version tag
        id: version
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="${YEAR}.${MONTH}"

          # Get all tags matching current year.month pattern
          LATEST_TAG=$(git tag -l "${PREFIX}.*" | sort -t. -k3 -n | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            # No tags for this month, start at 1
            NEW_VERSION="${PREFIX}.1"
          else
            # Extract the last number and increment
            LAST_NUM=$(echo "$LATEST_TAG" | cut -d. -f3)
            NEW_NUM=$((LAST_NUM + 1))
            NEW_VERSION="${PREFIX}.${NEW_NUM}"
          fi

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${NEW_VERSION}"

      - name: Create and push tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ steps.version.outputs.version }} -m "Production release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.version }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            cd prod/tc-delivery-server/

            echo "==> Pull latest production code"
            git pull origin prod

            echo "==> Load NVM"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Current Node version before nvm use:"
            node --version

            nvm use default

            echo "Current Node version after nvm use:"
            node --version
            npm --version

            echo "==> Install dependencies"
            npm ci

            echo "==> Backup current dist before clean build"
            rm -rf dist.backup
            if [ -d dist ]; then
              cp -a dist dist.backup
            fi

            echo "==> Clean TypeScript build output"
            rm -rf dist/

            echo "==> Build Production"
            if ! npm run build; then
              echo "Production build failed. Restoring previous dist and stopping deploy."
              rm -rf dist
              if [ -d dist.backup ]; then
                cp -a dist.backup dist
              fi
              exit 1
            fi

            echo "==> Verify build output"
            if [ ! -f dist/src/index.js ]; then
              echo "Missing dist/src/index.js after build. Restoring previous dist and stopping deploy."
              echo "Found index.js files:"
              find dist -name "index.js" -print || true
              rm -rf dist
              if [ -d dist.backup ]; then
                cp -a dist.backup dist
              fi
              exit 1
            fi

            echo "==> Restart Production API only after successful build"
            pm2 restart tc-delivery-server-prod --update-env

            echo "==> Deploy cronjobs only after API build/restart success"
            pm2 delete tc-delivery-debt-calculator-prod || true
            pm2 start ecosystem.config.js --only tc-delivery-debt-calculator-prod --update-env

            pm2 delete tc-delivery-sms-queue-prod || true
            pm2 start ecosystem.config.js --only tc-delivery-sms-queue-prod --update-env

            echo "==> Save PM2 process list"
            pm2 save

            echo "==> Show PM2 status"
            pm2 status

            echo "==> Show API logs"
            pm2 logs tc-delivery-server-prod --lines 20 --nostream
