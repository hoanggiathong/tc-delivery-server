name: Deploy to VPS UAT Environment

on:
  push:
    branches: [dev]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to VPS UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

        - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          ssh -T \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e

            cd /root/dev/tc-delivery-server

            echo "===== Pull latest changes ====="
            git fetch origin dev
            git reset --hard origin/dev

            echo "===== Load Node/NVM ====="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            nvm use default

            echo "Current Node version:"
            node --version

            echo "Current NPM version:"
            npm --version

            echo "===== Install dependencies ====="
            npm ci

            echo "===== Clean old build ====="
            rm -rf dist/

            echo "===== Build backend ====="
            npm run build

            echo "===== Verify build output ====="
            if [ ! -f dist/src/index.js ]; then
              echo "Build failed: dist/src/index.js not found"
              find dist -name "index.js" -print || true
              exit 1
            fi

            echo "===== Restart UAT backend ====="
            pm2 restart tc-delivery-server-uat --update-env || \
            pm2 start ecosystem.config.js --only tc-delivery-server-uat --update-env

            echo "===== Restart cronjobs ====="
            pm2 delete tc-delivery-debt-calculator-uat || true
            pm2 start ecosystem.config.js --only tc-delivery-debt-calculator-uat --update-env

            pm2 delete tc-delivery-sms-queue-uat || true
            pm2 start ecosystem.config.js --only tc-delivery-sms-queue-uat --update-env

            pm2 save

            echo "===== PM2 status ====="
            pm2 status

            echo "===== Backend logs ====="
            pm2 logs tc-delivery-server-uat --lines 50 --nostream

          EOF
