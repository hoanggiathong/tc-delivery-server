name: Deploy to VPS UAT Environment

on:
  push:
    branches: [dev]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to VPS UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd dev/tc-delivery-server/

            # Pull latest changes
            git pull origin dev

            # Load NVM and use default Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Current Node version:"
            node --version

            nvm use default

            # Install dependencies
            npm ci

            # Clean typescript build cache
            rm -rf dist/

            # Build and deploy UAT environment (force restart to reload config)
            npm run deploy:force:uat

            # Deploy cronjobs (force restart to reload config)
            pm2 delete tc-delivery-debt-calculator-uat || true
            pm2 start ecosystem.config.js --only tc-delivery-debt-calculator-uat

            pm2 delete tc-delivery-sms-queue-uat || true
            pm2 start ecosystem.config.js --only tc-delivery-sms-queue-uat

            # Show PM2 status
            pm2 status

            # Show logs (last 20 lines)
            pm2 logs tc-delivery-server-uat --lines 20 --nostream